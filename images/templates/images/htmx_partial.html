{% load i18n %}
<div id="{{ page_obj.number }}" class="subcontainer">
{% for image in images %}
    <div class="text-item" data-id="{{ image.id }}" onclick='showModal({{ image.id }}, "{{ image.file.url }}", "{{ image.note|escapejs }}")'>
        {{ image.note }}
    </div>
    <!-- Modal Structure -->
    <div class="modal fade" id="imageModal_{{ image.id}}" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content image-wrapper">
                <div class="modal-header">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label={% translate "Close" %}></button>
                </div>
                <div class="modal-body">
                    <img src="{{ image.file.url }}" id="modalImage_{{ image.id}}" alt="{{ image.note }}" class="img-fluid">

                    <p id="imageNote_{{ image.id}}">
                        {{ image.note}}
                    </p>
                </div>
                <div class="modal-footer">
                    <div class="overlay position-absolute top-0 start-0 d-flex align-items-center justify-content-center">
                        <button id="zoomButton_{{ image.id }}" type="button" class="btn btn-light" title="{% translate "High-res image" %}"><i class="bi bi-zoom-in"></i></button>
                        <a id="selectButton_{{ image.id }}"
                            role="button"
                            class="btn btn-light selectButton"
                            data-bs-toggle="tooltip"
                            data-selected="{% if image.id in selected_images_ids %}true{% else %}false{% endif %}"
                            data-image-id="{{ image.id }}"
                            {% if image.id in selected_images_ids %}
                                title="{% translate 'Remove from Selection' %}"
                            {% else %}
                                title="{% translate 'Select' %}"
                            {% endif %}
                        >
                            {% if image.id in selected_images_ids %}
                                <i class="bi bi-heart-fill"></i>
                            {% else %}
                                <i class="bi bi-heart"></i>
                            {% endif %}
                        </a>
                        <a id="downloadButton_{{ image.id}}" class="btn btn-light" href="{{ image.file.url }}" download style="display: none;" title="{% translate "Download" %}"><i class="bi bi-download"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endfor %}

    <!-- Load more trigger with HTMX -->
    <div class="load-more-trigger"
        hx-trigger="revealed"
        hx-get="{% url 'home' %}?page={{ page_obj.number|add:1 }}{% if request.GET.search_query %}&search_query={{ request.GET.search_query }}{% endif %}"
        hx-target="#text-items-container"
        hx-swap="beforeend"
        >
    </div>
</div>
